# Prices of the models the extraction calls, in USD per 1 million tokens, in the format of
# backend/config/model_prices.yaml (Sinngam's, contract 11 section 4). The extraction reads both files; a row here
# wins. Sinngam: please copy these rows into the shared file, so the dashboard prices the same calls.
# A model the pricing page does not list stays null: the cost is then "price not set", never 0.

prices:
  - model: gemini-3.5-flash-lite
    usd_per_1m_in: 0.30
    usd_per_1m_out: 2.50          # includes thinking tokens
    usd_per_1m_cached: null
    source_url: https://ai.google.dev/gemini-api/docs/pricing
    checked_on: 2026-10-27

  # Not on the pricing page on 2026-10-27 (the page has 3.6 Flash, 3.8 Flash and 3.5 Flash-Lite, but no 3.5 Flash).
  - model: gemini-3.5-flash
    usd_per_1m_in: null
    usd_per_1m_out: null
    usd_per_1m_cached: null
    source_url: https://ai.google.dev/gemini-api/docs/pricing
    checked_on: 2026-10-27

  # Not on the pricing page on 2026-10-27 (only "3.1 Flash Lite Image", a different model).
  - model: gemini-3.1-flash-lite
    usd_per_1m_in: null
    usd_per_1m_out: null
    usd_per_1m_cached: null
    source_url: https://ai.google.dev/gemini-api/docs/pricing
    checked_on: 2026-10-27

  # The page lists "Gemini Embedding 2" (gemini-embedding-2) at $0.20 a million text tokens, not the -preview name we
  # call; set this when the preview is confirmed to have the same price.
  - model: gemini-embedding-2-preview
    usd_per_1m_in: null
    usd_per_1m_out: null
    usd_per_1m_cached: null
    source_url: https://ai.google.dev/gemini-api/docs/pricing
    checked_on: 2026-10-27
